# Build the Astro blog image into Harbor.
# REGISTRY_* CI vars: REGISTRY_IMAGE, REGISTRY_USER, REGISTRY_PASS.
# linux/amd64 only — cluster nodes are amd64; qemu-amd64 on arm64 crashes esbuild.
stages:
  - build

build-blog:
  stage: build
  rules:
    - if: '$REGISTRY_IMAGE == null'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  image:
    name: moby/buildkit:v0.33.0-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    DOCKER_CONFIG: /home/user/.docker
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - |
      REGISTRY="${REGISTRY_IMAGE%%/*}"
      AUTH=$(printf '%s' "$REGISTRY_USER:$REGISTRY_PASS" | base64 | tr -d '\n')
      cat > "$DOCKER_CONFIG/config.json" <<EOF
      {"auths":{"$REGISTRY":{"auth":"$AUTH"}}}
      EOF
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt platform=linux/amd64 \
        --output type=image,\"name=$REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA,$REGISTRY_IMAGE:latest\",push=true
